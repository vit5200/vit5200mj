<style>
:root{--font:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","Songti TC","Hiragino Mincho ProN","PMingLiU",serif;--serif:var(--font);
--bg:#0a0a0c;--bg2:#131316;--panel:#141417;--panel2:#1d1d21;--line:rgba(214,170,76,.5);--line2:rgba(214,170,76,.2);
--gold:#e3b64b;--goldhi:#fff0b3;--goldlo:#9a6a14;--red:#c1121f;--redhi:#e0262f;--redlo:#6d0910;
--b1:#9a6a14;--b2:#fff0b3;--l1:#6d0910;--l2:#e0262f;--lnc:#ff5a5a;--ink:#f3eee2;--ink2:#d9d2c0;--mute:#9a9385;--dim:#6b665b;--win:#5fd99d;--loss:#ff6b6b;--sc:rgba(214,170,76,.06);--nav:#000;--glow:rgba(140,12,20,.35)}
html,body{background:var(--bg)}
body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;color:var(--ink);
background-color:var(--bg);background-image:radial-gradient(ellipse 120% 55% at 50% 0,var(--glow),transparent 70%),
radial-gradient(circle at 50% 100%,transparent 0 38%,var(--sc) 39% 43%,transparent 44% 52%,var(--sc) 53% 57%,transparent 58% 66%,var(--sc) 67% 71%,transparent 72%),
radial-gradient(circle at 50% 100%,transparent 0 38%,var(--sc) 39% 43%,transparent 44% 52%,var(--sc) 53% 57%,transparent 58% 66%,var(--sc) 67% 71%,transparent 72%);
background-size:100% 100%,60px 30px,60px 30px;background-position:0 0,0 0,30px 15px}
button{touch-action:manipulation}input,select{font-size:max(16px,1rem)}
b,strong{font-family:var(--serif);font-weight:800}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:center;font-weight:600}
input[type=date]::-webkit-date-and-time-value{text-align:center}
[data-pid]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{background:var(--bg2);color:var(--ink);border:1px solid var(--line)!important;border-radius:4px}
input:focus{outline:none;border-color:var(--gold)!important;box-shadow:0 0 0 2px rgba(227,182,75,.3)}
::placeholder{color:var(--dim)}
/* 元件 */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,235,170,.07)}
.gold-text{background:linear-gradient(180deg,#fff6c8 0%,#f2c75a 42%,#b7791f 72%,#f6d77a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.gbtn{background:linear-gradient(180deg,#1c1c20,#0c0c0e);color:var(--gold);border:1px solid var(--gold);border-radius:4px;font-family:var(--serif);font-weight:800}
.banner-w{display:inline-block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.banner{display:inline-block;padding:.32rem 2.1rem;color:var(--goldhi);font-family:var(--serif);font-weight:900;letter-spacing:.1em;text-shadow:0 1px 0 #000;
background:linear-gradient(180deg,#d4222c,#7a0b12);clip-path:polygon(0 20%,2% 4%,9% 14%,31% 2%,60% 12%,92% 0,98% 16%,100% 62%,96% 100%,70% 90%,38% 100%,8% 92%,0 82%)}
.rule{height:10px;margin:6px auto 0;max-width:260px;background:linear-gradient(90deg,transparent,var(--gold),transparent) center/100% 1px no-repeat;position:relative}
.rule:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
#hdr{background:linear-gradient(180deg,#000,#101013)!important;border-bottom:1px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.6)}
#nav{background:var(--nav)!important;border-top:1px solid var(--gold);box-shadow:0 -6px 22px rgba(0,0,0,.45)!important}
.nav-on{box-shadow:inset 0 3px 0 var(--redhi)}
.debt-pill{font-size:0.6875rem;font-weight:700;padding:1px 7px;border-radius:3px;border:1px solid var(--loss);color:var(--loss);background:transparent;white-space:nowrap}
.debt-pill.paid{border-color:var(--dim);color:var(--dim);text-decoration:line-through}
.debt-on{background:linear-gradient(180deg,var(--redhi),var(--redlo));color:var(--goldhi);border:1px solid var(--gold)}
.debt-off{background:transparent;color:var(--mute);border:1px dashed var(--line)}
/* 排行卡 */
.rk-card{position:relative;border:1px solid var(--line);background:#050506;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 6px 16px rgba(0,0,0,.45)}
.rk-head{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.35rem 0;background:linear-gradient(180deg,#34080b,#12090a);border-bottom:1px solid var(--line)}
.rk-no{font-family:var(--serif);font-weight:900;font-size:1.625rem;line-height:1}
.rk-ar{position:absolute;left:8px;top:6px;font-size:0.6875rem;line-height:1.1;text-align:center;font-weight:800}
.rk-ar i{display:block;font-style:normal;font-size:0.4375rem;color:var(--mute);letter-spacing:.05em}
.rk-lab{text-align:center;font-size:0.75rem;color:var(--mute);background:linear-gradient(180deg,#1b1b1f,#0d0d10);border-bottom:1px solid var(--line2);padding:2px 0}
.rk-val{text-align:center;font-family:var(--serif);font-weight:900;font-size:1.375rem;padding:4px 0 6px;background:#000}
.rk-ph{position:relative;aspect-ratio:3/4;background:#111;overflow:hidden}
.rk-ph img{width:100%;height:100%;object-fit:cover;display:block}
.rk-ph .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:4.75rem;color:rgba(255,255,255,.9);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.rk-nm{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.88));text-align:center}
.rk-row{display:flex;align-items:center;gap:.6rem;padding:.6rem .75rem;background:#050506;border:1px solid var(--line);margin-bottom:6px;border-radius:3px}
/* 以 CSS 重新著色既有 Tailwind 類別 */

html .to-violet-600{--tw-gradient-to:var(--redlo)!important}

html .to-teal-500{--tw-gradient-to:var(--redlo)!important}
html .from-emerald-500{--tw-gradient-from:var(--b1)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
html .to-emerald-300{--tw-gradient-to:var(--b2)!important}

html .text-amber-700,html .text-amber-600{color:var(--gold)!important}html .border-amber-200{border-color:var(--line)!important}
html .text-emerald-600,html .text-emerald-700{color:var(--win)!important}

html .border-fuchsia-400{border-color:var(--gold)!important}
html .ring-indigo-600,html .ring-indigo-500{--tw-ring-color:var(--gold)!important}
html .from-amber-400{--tw-gradient-from:var(--goldlo)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
html .to-orange-500{--tw-gradient-to:var(--gold)!important}
html .shadow-md,html .shadow-lg,html .shadow-2xl,html .shadow{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.4)!important}
html .rounded-3xl{border-radius:6px!important}html .rounded-2xl{border-radius:5px!important}html .rounded-xl{border-radius:4px!important}
html button.rounded-full{border-radius:4px!important}
html .bg-black\/80{background:rgba(0,0,0,.88)}

/* ===== v14：文字放大、標題列、紅底字、滑動切換、排行列 ===== */
body{font-size:1.0625rem;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
html .text-xs{font-size:0.875rem!important;line-height:1.4!important}
html .text-sm{font-size:1rem!important;line-height:1.45!important}
html .text-base{font-size:1.0625rem!important}
html .text-lg{font-size:1.25rem!important}
html .text-xl{font-size:1.4375rem!important}
html .text-2xl{font-size:1.75rem!important}
html .text-\[11px\]{font-size:0.8125rem!important}
html .text-\[10px\]{font-size:0.75rem!important}
html .text-\[17px\]{font-size:1.1875rem!important}
#hdr{height:auto!important;align-items:center!important;padding-top:calc(env(safe-area-inset-top) + 14px)!important;padding-bottom:10px!important;min-height:4rem}
.gbtn{font-size:1rem}
.banner{font-size:1.1875rem;padding:.38rem 2.2rem}

.debt-on{font-size:0.9375rem!important}

.rk2{display:flex;align-items:center;gap:.55rem;padding:.75rem .7rem;margin-bottom:8px;background:linear-gradient(180deg,#0d0d10,#050506);border:1px solid var(--line);border-radius:5px;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4)}

@keyframes swl{from{opacity:.25;transform:translateX(36px)}to{opacity:1;transform:none}}

.sw-l{animation:swl .22s ease-out}.sw-r{animation:swr .22s ease-out}
@media (prefers-reduced-motion:reduce){.sw-l,.sw-r{animation:none}}

/* ===== v16：第二種風格「荒野草原」＋動畫 ===== */
html.wild{--bg:#d6e2cd;--bg2:#ece2c2;--panel:#f6ecd0;--panel2:#efe3c0;--line:rgba(96,70,28,.6);--line2:rgba(96,70,28,.26);
--gold:#0e6a70;--goldhi:#0a4a50;--goldlo:#0f7f84;--red:#17848a;--redhi:#27a9a6;--redlo:#0b5a62;
--ink:#3a2c15;--ink2:#53422a;--mute:#7a6843;--dim:#a39469;--win:#1b7f4b;--loss:#b4321f;--sc:rgba(0,0,0,0);--nav:#10333a;--glow:rgba(0,0,0,0);
--b1:#139a94;--b2:#7fe6d8;--l1:#a8341f;--l2:#e98a62;--lnc:#14a39c}
html.wild body{background-image:linear-gradient(180deg,#8fc7c8 0,#c9ddc9 26%,#e4e0c3 62%,#d9cfa8 100%);background-size:100% 100%;background-attachment:fixed;background-position:0 0}
html.wild body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:-1;pointer-events:none;
background:radial-gradient(120% 100% at 18% 100%,rgba(70,120,100,.3) 0 38%,transparent 39%),radial-gradient(110% 90% at 88% 100%,rgba(60,105,110,.26) 0 40%,transparent 41%)}
html.wild .panel{background:linear-gradient(180deg,#f9f0d6,#f0e4c0);border-radius:12px;box-shadow:inset 0 0 0 3px #f6ecd0,inset 0 0 0 4px rgba(96,70,28,.28),0 6px 14px rgba(50,60,40,.28)}
html.wild .gold-text{background-image:linear-gradient(180deg,#1b8c91 0%,#0e5d63 60%,#0a3f45 100%);filter:drop-shadow(0 1px 0 rgba(255,255,255,.55))}
html.wild #hdr .gold-text{background-image:linear-gradient(180deg,#fff6d8,#ecd899 65%,#c9a24a);filter:drop-shadow(0 0 8px rgba(95,245,227,.5))}
html.wild #hdr{background:linear-gradient(180deg,#16444c,#0d2b32)!important;border-bottom:2px solid #c9a24a;box-shadow:0 4px 16px rgba(10,40,45,.45)}
html.wild #nav{background:linear-gradient(180deg,#16444c,#0d2b32)!important;border-top:2px solid #c9a24a}
html.wild #nav .text-slate-500{color:#9cc3be!important}
html.wild #nav .text-indigo-700{color:#8ff7ea!important}
html.wild .nav-on{box-shadow:inset 0 3px 0 #5ff5e3}
html.wild .bg-indigo-100{background-color:rgba(95,245,227,.18)!important}
html.wild .gbtn{background:linear-gradient(180deg,#1d5c64,#0e3a41);color:#f4e7bd;border:1px solid #c9a24a;border-radius:10px;box-shadow:0 0 10px rgba(95,245,227,.25),inset 0 0 0 1px rgba(255,255,255,.12)}
html.wild .banner{color:#fff;background:linear-gradient(180deg,#1f9ba0,#0b4f57);clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);text-shadow:0 1px 2px rgba(0,0,0,.45);padding-left:2.5rem;padding-right:2.5rem}
html.wild .bg-indigo-600,html.wild .from-indigo-600,html.wild .from-emerald-400,html.wild .debt-on{color:#fff!important;-webkit-text-fill-color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4);border:1px solid #c9a24a!important;box-shadow:0 0 12px rgba(95,245,227,.3)}
html.wild input,html.wild select{border-radius:8px}
html.wild input:focus{box-shadow:0 0 0 2px rgba(31,170,160,.35)}
html.wild .rounded-3xl{border-radius:14px!important}html.wild .rounded-2xl{border-radius:11px!important}html.wild .rounded-xl{border-radius:9px!important}
html.wild button.rounded-full{border-radius:999px!important}
html.wild .shadow-md,html.wild .shadow-lg,html.wild .shadow-2xl,html.wild .shadow{box-shadow:0 4px 12px rgba(50,60,40,.3)!important}
html.wild .rk-card{background:#f6ecd0;box-shadow:0 5px 12px rgba(50,60,40,.3)}
html.wild .rk-head{background:linear-gradient(180deg,#1d5c64,#0e3a41)}
html.wild .rk-lab{background:#ece0bb}html.wild .rk-val{background:#f6ecd0}html.wild .rk-ph{background:#cdbd96}html.wild .rk-row{background:#f6ecd0}
html.wild .rk2{background:linear-gradient(180deg,#fbf3da,#efe3c0);border-radius:12px;box-shadow:inset 0 0 0 3px #f6ecd0,inset 0 0 0 4px rgba(96,70,28,.25),0 4px 10px rgba(50,60,40,.25)}
html.wild .rk2.top{border-color:#c9a24a;box-shadow:inset 0 0 0 3px #f6ecd0,0 0 14px rgba(201,162,74,.55)}
html.wild .rk2.first{background:linear-gradient(90deg,rgba(47,214,200,.3),#fbf3da 72%)}
html.wild .debt-pill{border-radius:999px}

/* 動畫（僅在換頁／換選項時播放一次） */
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes gu{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rkin{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(130%)}}
@keyframes navpop{0%{transform:scale(.65) translateY(5px)}60%{transform:scale(1.14)}100%{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fi{from{opacity:0}}
@keyframes dotin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes mpop{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
#v.anim>*{animation:fu .42s cubic-bezier(.2,.7,.2,1) both}
#v.anim>*:nth-child(2){animation-delay:.05s}#v.anim>*:nth-child(3){animation-delay:.1s}#v.anim>*:nth-child(4){animation-delay:.15s}
#v.anim>*:nth-child(5){animation-delay:.2s}#v.anim>*:nth-child(6){animation-delay:.25s}#v.anim>*:nth-child(n+7){animation-delay:.3s}
#v.anim .rk2,#v.anim .wr-card{animation:rkin .46s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),9)*65ms + 120ms)}
#v.anim .wr-card{animation-name:fu}
.rk2{position:relative;overflow:hidden}
#v.anim .rk2.first::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,240,190,.32) 50%,transparent 62%);transform:translateX(-130%);animation:shine 1.1s .9s ease-out 1 both}
#v.anim .gr-up,#v.anim .gr-dn,#v.anim .gr-x{animation-duration:.75s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;animation-delay:calc(var(--i,0)*70ms + 220ms)}
#v.anim .gr-up{transform-origin:bottom;animation-name:gu}
#v.anim .gr-dn{transform-origin:top;animation-name:gu}
#v.anim .gr-x{transform-origin:left;animation-name:gx}
.ln{fill:none;stroke:var(--lnc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.ln-area{fill:var(--lnc);opacity:.15}
.ln-dot{fill:var(--lnc);transform-box:fill-box;transform-origin:center}
#v.anim .ln{stroke-dashoffset:1;animation:draw 1.3s .3s cubic-bezier(.4,.1,.2,1) forwards}
#v.anim .ln-area{animation:fi .8s 1.1s both}
#v.anim .ln-dot{animation:dotin .3s cubic-bezier(.3,1.6,.5,1) both}
#nav.anim .nav-on svg{animation:navpop .5s cubic-bezier(.3,1.4,.5,1)}
.nav-on svg{filter:drop-shadow(0 0 5px rgba(224,38,47,.8))}
html.wild .nav-on svg{filter:drop-shadow(0 0 6px #5ff5e3)}
#modal.mnew>*{animation:mpop .26s cubic-bezier(.2,.8,.2,1)}
html.tx,html.tx *{transition:font-size .35s,background-color .45s,color .45s,border-color .45s,fill .45s,stroke .45s,box-shadow .45s!important}
@media (prefers-reduced-motion:reduce){#v.anim *,#v.anim>*,#nav.anim *,#modal.mnew>*,.rk2::after{animation:none!important}.ln{stroke-dashoffset:0!important}html.tx,html.tx *{transition:none!important}}

/* ===== v17：字體大小（以 rem 同步縮放）與機型自適應 ===== */
html{font-size:calc(clamp(14px,4.1vw,18px)*var(--fs,1));-webkit-text-size-adjust:100%;text-size-adjust:100%}
html .text-\[15px\]{font-size:.9375rem!important}
html .text-\[24px\]{font-size:1.5rem!important}
html .text-\[30px\]{font-size:1.875rem!important}
html .text-\[34px\]{font-size:2.125rem!important}
html .h-\[78px\]{height:4.875rem!important}
html .w-\[100px\]{width:6.25rem!important}
#nav svg{width:1.875rem;height:1.875rem}
@media (max-width:359px){#hdr .gbtn{padding-left:.5rem;padding-right:.5rem}}
@media (min-width:768px){#v{max-width:34rem}}

/* ===== v18：統一字體、荒野草原、排行榜動畫 ===== */
body{font-family:var(--font);font-weight:600;font-variant-numeric:tabular-nums}
input,select,button,textarea{font-family:inherit}
html .font-normal,html .font-medium{font-weight:600!important}
html .font-semibold{font-weight:700!important}
html{--mute:#aaa392;--dim:#7f7a6d}
html.wild{--font:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Hiragino Sans",sans-serif;
--panel:#f8f1d8;--panel2:#f0e8c6;--ink:#2b2210;--ink2:#46391f;--mute:#66552f;--dim:#96865c;
--gold:#0f6a5c;--goldhi:#0a4a40;--goldlo:#12806d;--red:#1b8a6e;--redhi:#34b58f;--redlo:#0d6a55;--b1:#16a085;--b2:#8af0cf;--lnc:#16a085}
html.wild body{background-image:linear-gradient(180deg,#8fd0e8 0,#cde9c0 30%,#a9d58a 68%,#86bd62 100%)}
html.wild body::before{background:radial-gradient(120% 100% at 18% 100%,rgba(50,130,70,.42) 0 38%,transparent 39%),radial-gradient(110% 90% at 88% 100%,rgba(35,105,75,.34) 0 40%,transparent 41%)}
html.wild #hdr,html.wild #nav{background:linear-gradient(180deg,#1c5a3f,#0f3a2a)!important;border-color:#d1a93f}
html.wild #nav .text-slate-500{color:#b4dcc0!important}
html.wild #nav .text-indigo-700{color:#b6ffd6!important}
html.wild .nav-on{box-shadow:inset 0 3px 0 #8dffc0}
html.wild .nav-on svg{filter:drop-shadow(0 0 6px #8dffc0)}
html.wild .bg-indigo-100{background-color:rgba(150,255,200,.22)!important}
html.wild .gbtn{background:linear-gradient(180deg,#226b4a,#10412f);box-shadow:0 0 10px rgba(141,255,192,.3),inset 0 0 0 1px rgba(255,255,255,.12)}
html.wild .banner{background:linear-gradient(180deg,#2fa07a,#0d5a45)}
html.wild .rk-head{background:linear-gradient(180deg,#226b4a,#10412f)}
html.wild #hdr .gold-text{filter:drop-shadow(0 0 8px rgba(141,255,192,.55))}
html.wild .rk2.first{background:linear-gradient(90deg,rgba(80,200,120,.3),#fbf3da 72%)}
html.wild .bg-indigo-600,html.wild .from-indigo-600,html.wild .from-emerald-400,html.wild .debt-on{box-shadow:0 0 12px rgba(141,255,192,.35)}
/* 排行榜名次欄 */
.rkc{width:3.1rem;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:.15rem;line-height:1}
.rk2.first .rkc{width:4rem}
.rk-ic{display:block;height:2rem}
.rk-ic svg{width:2rem;height:2rem;display:block}
.rk2.first .rk-ic{height:3rem}.rk2.first .rk-ic svg{width:3rem;height:3rem}
.rk-n{font-family:var(--font);font-weight:900;font-size:1.5rem;color:var(--gold)}
.rk2.first .rk-n{font-size:2.3rem}
.rk2.first{padding-top:1.05rem;padding-bottom:1.05rem}
.mv{font-weight:900;font-size:1.05rem;line-height:1}
/* 排行榜前三名動畫（慢速、清楚） */
@keyframes shine{0%{transform:translateX(-170%) skewX(-18deg)}50%,100%{transform:translateX(340%) skewX(-18deg)}}
@keyframes glow{0%,100%{box-shadow:var(--ins,0 0 0 0 transparent),0 0 0 1px rgba(0,0,0,.4),0 0 10px rgba(var(--gl),.3)}50%{box-shadow:var(--ins,0 0 0 0 transparent),0 0 0 1px rgba(0,0,0,.4),0 0 36px 5px rgba(var(--gl),.9)}}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1.4) rotate(35deg)}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 2px rgba(var(--gl),.4))}50%{transform:translateY(-3px) scale(1.14);filter:drop-shadow(0 0 10px rgba(var(--gl),1))}}
.rk2.g1{--shc:rgba(255,232,90,.95);--gl:255,208,40;--tw:#ffd84a}
.rk2.g2{--shc:rgba(255,196,80,.92);--gl:245,172,40;--tw:#ffc34d}
.rk2.g3{--shc:rgba(240,246,252,.95);--gl:196,210,228;--tw:#e8f0f8}
html.wild .rk2.g1{--shc:rgba(255,214,60,.95);--gl:240,190,20}
html.wild .rk2.g2{--shc:rgba(255,176,40,.9);--gl:235,150,20}
html.wild .rk2.g3{--shc:rgba(120,160,200,.7);--gl:110,150,195}
html.wild .rk2.top{--ins:inset 0 0 0 3px #f6ecd0}
.rk2.top{z-index:2;animation:glow 3.8s ease-in-out infinite;animation-delay:calc(var(--i,0)*.5s)}
.rk2.top::after{content:"";position:absolute;top:-25%;bottom:-25%;left:0;width:55%;pointer-events:none;background:linear-gradient(105deg,transparent 0,var(--shc) 50%,transparent 100%);transform:translateX(-170%) skewX(-18deg);animation:shine 5.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*.9s + .8s)}
html.wild .rk2.top::after{width:62%}
.rk2.top::before{content:"✦";position:absolute;right:.55rem;top:.1rem;font-size:1.35rem;line-height:1;color:var(--tw,#ffe28a);text-shadow:0 0 8px rgba(var(--gl),.9);pointer-events:none;z-index:1;animation:tw 3s ease-in-out infinite;animation-delay:calc(var(--i,0)*.5s)}
.rk2.top .rk-ic{animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0)*.4s)}
#v.anim .rk2.top{animation:rkin .46s cubic-bezier(.2,.8,.2,1) both,glow 3.8s ease-in-out infinite;animation-delay:calc(min(var(--i,0),9)*65ms + 120ms),calc(.8s + var(--i,0)*.5s)}
@media (prefers-reduced-motion:reduce){.rk2.top,.rk2.top::before,.rk2.top::after,.rk2.top .rk-ic{animation:none!important}}

/* ===== v19：掃光更慢更明顯、金銀銅皇冠 ===== */
@keyframes shine{0%{transform:translateX(-130%) skewX(-18deg)}72%,100%{transform:translateX(300%) skewX(-18deg)}}
.rk2.g1{--shc:rgba(255,226,70,.95);--gl:255,208,40;--tw:#ffd84a}
.rk2.g2{--shc:rgba(236,244,255,.95);--gl:205,220,240;--tw:#eef4fb}
.rk2.g3{--shc:rgba(255,160,90,.92);--gl:232,140,80;--tw:#ffb98a}
html.wild .rk2.g1{--shc:rgba(255,184,0,1);--gl:240,180,0}
html.wild .rk2.g2{--shc:rgba(105,145,190,.95);--gl:110,148,190}
html.wild .rk2.g3{--shc:rgba(214,108,40,.95);--gl:215,115,50}
html.wild .rk2.g1{background:linear-gradient(90deg,rgba(255,205,60,.6),#fbf3da 78%)}
html.wild .rk2.g2{background:linear-gradient(90deg,rgba(150,178,210,.45),#fbf3da 78%)}
html.wild .rk2.g3{background:linear-gradient(90deg,rgba(220,135,75,.4),#fbf3da 78%)}
.rk2.top::after{width:70%;background:linear-gradient(105deg,transparent 0,var(--shc) 50%,transparent 100%);mix-blend-mode:screen;animation:shine 9s ease-in-out infinite;animation-delay:calc(var(--i,0)*1.3s + .6s)}
html.wild .rk2.top::after{width:80%;mix-blend-mode:multiply}

/* ===== v20：移除掃光、粗減號、草原星點 ===== */
.rk2.top::after,html.wild .rk2.top::after{content:none!important;animation:none!important;display:none!important}
.mv.same{display:inline-block;width:1.2rem;height:.32rem;border-radius:2px;background:currentColor;font-size:0;line-height:0;vertical-align:middle;margin:.3rem 0}
html.wild .rk2.g1{--tw:#e58a00}
html.wild .rk2.g2{--tw:#4f7fb8}
html.wild .rk2.g3{--tw:#c2571a}
html.wild .rk2.top::before{font-size:1.6rem;-webkit-text-stroke:.6px rgba(70,40,0,.55);text-shadow:0 0 6px rgba(var(--gl),1),0 0 14px rgba(var(--gl),.7)}
</style>
</head>
<body class="min-h-screen">
<header id="hdr" class="sticky top-0 z-20 flex items-end gap-2 px-4 pb-2" style="padding-top:env(safe-area-inset-top);height:calc(3.5rem + env(safe-area-inset-top))"></header>
<main id="v" class="p-3 pb-40 max-w-md mx-auto"></main>
<nav id="nav" class="fixed bottom-0 inset-x-0 z-20 bg-white/95 backdrop-blur border-t shadow-[0_-4px_16px_rgba(79,70,229,0.12)] grid grid-cols-5" style="padding-bottom:env(safe-area-inset-bottom)"></nav>
<div id="modal"></div>
<div id="lb"></div>
<div id="tour"></div>
<input type="file" id="imp" accept=".json,.txt,.xlsx,application/json,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" onchange="impFile(this)">
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-36 z-[60] bg-slate-800 text-white px-5 py-3 rounded-full text-sm opacity-0 transition pointer-events-none"></div>

<script>
const K='mj_data_v1';
let S;try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
S=S||{players:[],games:[]};S.venues=S.venues||[];
const cleanId=s=>String(s==null?'':s).replace(/[^\w-]/g,'').slice(0,40);
const cleanCol=c=>/^#[0-9a-fA-F]{3,8}$/.test(c)?c:'#94a3b8';
const cleanStr=(s,n)=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f]/g,'').slice(0,n);
const okPhoto=p=>typeof p==='string'&&p.length<600000&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(p);
const fin=(v,d=0)=>Number.isFinite(+v)?+v:d;
/* 匯入／讀取時的資料驗證：避免壞檔或惡意檔案注入畫面 */
function sanitizeData(d){
  if(!d||!Array.isArray(d.players)||!Array.isArray(d.games))throw 0;
  const players=[];
  d.players.forEach(p=>{if(!p)return;const id=cleanId(p.id),name=cleanStr(p.name,24);if(!id||!name||players.some(x=>x.id===id))return;const o={id,name,color:cleanCol(p.color)};if(okPhoto(p.photo))o.photo=p.photo;players.push(o)});
  const games=[];
  d.games.forEach(g=>{
    if(!g||!Array.isArray(g.res))return;const id=cleanId(g.id);if(!id||!/^\d{4}-\d{2}-\d{2}$/.test(g.date)||games.some(x=>x.id===id))return;
    const res=[];let bad=false;
    g.res.forEach(r=>{if(!r||bad)return;const rid=cleanId(r.id);if(!rid||!Number.isFinite(+r.amt)){bad=true;return}
      const o={id:rid,name:cleanStr(r.name,24),color:cleanCol(r.color),amt:fin(r.amt)};
      if(r.unk)o.unk=1;if(r.debt){o.debt=Math.abs(fin(r.debt));o.paid=r.paid?1:0}res.push(o)});
    if(bad||!res.length)return;
    games.push({id,date:g.date,vid:cleanId(g.vid),vname:cleanStr(g.vname,40),rounds:Math.max(0,Math.round(fin(g.rounds))),fee:Math.max(0,fin(g.fee)),res});
  });
  const venues=[];(Array.isArray(d.venues)?d.venues:[]).forEach(v=>{if(!v)return;const id=cleanId(v.id),name=cleanStr(v.name,40);if(id&&name&&!venues.some(x=>x.id===id))venues.push({id,name})});
  return {players,games,venues};
}
try{if(S&&Array.isArray(S.players)&&Array.isArray(S.games))S=sanitizeData(S);else S=null}catch(e){S=null}
S=S||{players:[],games:[],venues:[]};
/* 延遲合併儲存（打字時不會每個字都寫入），離開頁面時立即寫入 */
let _st=0,_warned=false;
const saveNow=()=>{clearTimeout(_st);_st=0;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){if(!_warned){_warned=true;alert('儲存失敗：瀏覽器儲存空間不足或被封鎖。請先匯出備份。')}}};
const save=()=>{clearTimeout(_st);_st=setTimeout(saveNow,150)};
addEventListener('pagehide',()=>{if(_st)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&_st)saveNow()});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const money=n=>(n>0?'+':n<0?'−':'')+Math.abs(n).toLocaleString();
const cls=n=>n>0?'text-emerald-600':n<0?'text-red-500':'text-slate-400';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pl=id=>S.players.find(p=>p.id===id);
const COLORS=['#ef4444','#f97316','#eab308','#84cc16','#22c55e','#14b8a6','#06b6d4','#3b82f6','#6366f1','#8b5cf6','#a855f7','#ec4899','#f43f5e','#78716c','#0f766e','#92400e'];
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const CARD='panel',BTN='active:scale-95 transition';
const av=(n,c,ph,sz=36,pid)=>ph?`<img src="${ph}" ${pid?`onclick="showPhoto('${pid}')"`:''} class="rounded-full object-cover shrink-0 border-2" style="width:${sz/16}rem;height:${sz/16}rem;border-color:${c}">`:`<span class="rounded-full text-white font-bold flex items-center justify-center shrink-0" style="width:${sz/16}rem;height:${sz/16}rem;font-size:${(sz*0.42/16).toFixed(3)}rem;background:${c}">${esc([...n][0]||'?')}</span>`;
function showPhoto(id){const p=pl(id);if(!p||!p.photo)return;$('lb').innerHTML=`<div onclick="this.parentNode.innerHTML=''" class="fixed inset-0 z-[70] bg-black/80 flex flex-col items-center justify-center"><img src="${p.photo}" class="w-72 h-72 rounded-3xl object-cover shadow-2xl border-4" style="border-color:${p.color}"><div class="text-white text-xl font-bold mt-4">${esc(p.name)}</div><div class="text-white/60 text-sm mt-1">點任意處關閉</div></div>`;tr($('lb'))}
function setPhoto(id,inp){
  const f=inp.files[0];if(!f)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{
    const s=240,c=document.createElement('canvas');c.width=c.height=s;
    const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    URL.revokeObjectURL(u);pl(id).photo=c.toDataURL('image/jpeg',0.82);save();openSet();toast('照片已更新');
  };
  img.onerror=()=>{URL.revokeObjectURL(u);alert('無法讀取這張照片，請換一張試試')};
  img.src=u;inp.value='';
}
function rmPhoto(id){delete pl(id).photo;save();openSet()}
const fmtD=d=>{if(!d)return L('請選擇日期','Choose a date','日付を選択');const [y,m,x]=d.split('-').map(Number),w=new Date(y,m-1,x).getDay();return L(`${y} 年 ${m} 月 ${x} 日（${'日一二三四五六'[w]}）`,`${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][w]}, ${MON[m-1]} ${x}, ${y}`,`${y}年${m}月${x}日（${'日月火水木金土'[w]}）`)};
const lb=t=>`<div class="text-sm font-semibold text-slate-500 mt-4 mb-2">${t}</div>`;
const debtOn=()=>PREF.debt!==false;
const nowStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const newD=()=>({date:nowStr(),sel:[],vals:['','','',''],sg:[1,1,1,1],vid:'',vn:'',eid:'',rounds:'',fee:'',debt:[0,0,0,0],paid:[0,0,0,0],snap:{}});
let tab=0,selDay=null,lim=30,chartP='',chartY='all',rankY='all',calPick=false,D=newD();
let cal={y:+today.slice(0,4),m:+today.slice(5,7)-1};
const UNK={name:'未知',color:'#94a3b8'};
const pp=id=>id==='unk'?UNK:(pl(id)||D.snap[id]);
const hasU=()=>D.sel.includes('unk');
const sum4On=()=>PREF.sum4===true;
const autoIdx=()=>(sum4On()&&!hasU()&&D.sel.length==4)?3:-1;
function setR(e){D.rounds=e.value.replace(/\D/g,'');e.value=D.rounds}
const IC=p=>`<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const TABS=[
 [IC('<rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 10.5h17M8 3v4M16 3v4"/><path d="M12 13.2l2 2.1-2 2.1-2-2.1z" fill="currentColor"/>'),'日曆'],
 [IC('<path d="M4 20.5l.9-4.1L16.4 4.9a2.1 2.1 0 013 3L7.9 19.6z"/><path d="M14.5 6.8l3 3"/><path d="M13 20.5h7.5"/>'),'記錄'],
 [IC('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5"/>'),'勝率'],
 [IC('<path d="M3.5 20.5h17"/><rect x="5" y="12.5" width="3.4" height="8"/><rect x="10.3" y="7.5" width="3.4" height="13"/><rect x="15.6" y="3.5" width="3.4" height="17"/>'),'圖表'],
 [IC('<path d="M4.5 18L3 8l5 4 4-7 4 7 5-4-1.5 10z"/><path d="M4.5 21h15"/>'),'排行']];
const empty='<div class="'+CARD+' p-8 text-center text-slate-400"><div class="text-4xl mb-2">🀄</div>尚無資料，請先新增人員與對弈紀錄</div>';
function toast(m){const t=$('toast');t.textContent=trs(m);t.classList.remove('opacity-0');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('opacity-0'),1800)}

/* ===== 偏好設定 / 多語系 / 深色模式 ===== */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const PK='mj_pref_v1';
let PREF={lang:'zh',dark:false};
try{PREF=Object.assign(PREF,JSON.parse(localStorage.getItem(PK)||'{}'))}catch(e){}
let LANG=PREF.lang;
const savePref=()=>{try{localStorage.setItem(PK,JSON.stringify(PREF))}catch(e){}};
const L=(zh,en,ja)=>LANG==='en'?en:LANG==='ja'?(ja??en):zh;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=()=>LANG==='en'?['S','M','T','W','T','F','S']:LANG==='ja'?['日','月','火','水','木','金','土']:['日','一','二','三','四','五','六'];
const FS={s:.9,m:1,l:1.15};
const PREF_KEYS=['lang','theme','fee','debt','autoBk','sum4','minGames','fs'];
const prefsClean=()=>{const o={};PREF_KEYS.forEach(k=>{if(PREF[k]!==undefined)o[k]=PREF[k]});return o};
function applyPrefs(p){
  if(!p||typeof p!=='object')return false;
  const o={},bo=v=>v===true||v==='true'?true:v===false||v==='false'?false:undefined;
  if(['zh','en','ja'].includes(p.lang))o.lang=p.lang;
  if(['noir','wild','ivory'].includes(p.theme))o.theme=p.theme==='ivory'?'wild':p.theme;
  ['fee','debt','autoBk','sum4'].forEach(k=>{const b=bo(p[k]);if(b!==undefined)o[k]=b});
  const mg=parseInt(p.minGames);if(Number.isFinite(mg)&&mg>=0&&mg<1000)o.minGames=mg;
  if(['s','m','l'].includes(p.fs))o.fs=p.fs;
  if(!Object.keys(o).length)return false;
  Object.assign(PREF,o);LANG=PREF.lang;savePref();applyTheme();return true;
}
function applyTheme(){
  document.documentElement.style.setProperty('--fs',FS[PREF.fs]||1);
  if(PREF.theme==='ivory')PREF.theme='wild';
  document.documentElement.classList.toggle('wild',PREF.theme==='wild');
  document.documentElement.lang=LANG==='zh'?'zh-Hant':LANG;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=PREF.theme==='wild'?'#10333a':'#000000';
}
applyTheme();

const EX={'贏':['Win','勝ち'],'輸':['Lose','負け'],'勝':['W','勝'],'負':['L','負'],'和':['D','分'],'人員':['Players','人数'],'總場次':['Total games','総対局数'],'本月場次':['This month','今月'],'金額':['Amount','金額'],'例如 8':['e.g. 8','例 8']};
const DICT={
'日曆':['Calendar','カレンダー'],'記錄':['Record','記録'],'勝率':['Win %','勝率'],'圖表':['Charts','グラフ'],'排行':['Ranking','ランキング'],
'尚無資料，請先新增人員與對弈紀錄':['No data yet. Add players and games first.','データがありません。先にプレイヤーと対局を追加してください。'],
'＋ 新增此日紀錄':['＋ Add record for this day','＋ この日の記録を追加'],
'無紀錄':['No records','記録なし'],
'編輯紀錄':['Edit record','記録を編集'],'取消編輯':['Cancel edit','編集をやめる'],'編輯':['Edit','編集'],
'確定刪除這筆紀錄？':['Delete this record?','この記録を削除しますか？'],'刪除':['Delete','削除'],'移除':['Remove','外す'],
'📅 日期':['📅 Date','📅 日付'],
'📍 對弈場所（可不選）':['📍 Venue (optional)','📍 対局場所（任意）'],
'管理場所':['Manage venues','場所を管理'],
'尚未新增場所，請點右側「管理場所」':['No venues yet. Tap "Manage venues" on the right.','場所がありません。右の「場所を管理」から追加してください。'],

function trs(s){
  if(LANG==='zh'||typeof s!=='string')return s;
  const i=LANG==='en'?0:1,core=s.trim();
  if(EX[core])return s.replace(core,EX[core][i]);
  let o=s;
  for(const r of RULES)o=o.replace(r[0],r[i+1]);
  for(const k of DK)if(o.includes(k))o=o.split(k).join(DICT[k][i]);
  return o;
}
function tr(root){
  if(!root||LANG==='zh')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),a=[];let n;
  while(n=w.nextNode())a.push(n);
  a.forEach(n=>{const v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
  root.querySelectorAll('[placeholder]').forEach(e=>{e.placeholder=trs(e.placeholder)});
}

let tourI=-1,TA=TOUR,tourModal=null;
const pickX=a=>LANG==='en'?a[1]:LANG==='ja'?a[2]:a[0];
function mset(x){const m=$('modal'),was=!!m.innerHTML;m.classList.toggle('mnew',!was);m.innerHTML=x}
function modalQuiet(){$('modal').innerHTML='';document.body.style.overflow='';tourModal=null}
function startTour(){closeSet();TA=TOUR.filter(s=>(feeOn()||!s.f)&&(debtOn()||!s.d));tourI=0;tourModal=null;tourStep()}
function endTour(){tourI=-1;$('tour').innerHTML='';if(tourModal){modalQuiet();render()}}
function tourGo(d){tourI+=d;if(tourI>=TA.length)return endTour();if(tourI<0)tourI=0;tourStep()}
function tourStep(){
  const s=TA[tourI];
  if((s.open||null)!==tourModal&&tourModal)modalQuiet();
  if(s.open&&tourModal!==s.open){if(s.open==='prefs')openPrefs();else openSet();tourModal=s.open}
  if(!s.open&&s.tab!==undefined&&s.tab!==tab){tab=s.tab;render();scrollTo(0,0)}
  setTimeout(()=>{
    const el=s.sel?document.querySelector(s.sel):null;
    if(el)el.scrollIntoView({block:'center'});
    setTimeout(()=>drawTour(el),140);
  },90);
}
function drawTour(el){
  const s=TA[tourI],last=tourI===TA.length-1,vh=innerHeight;
  let hole,pos='top:30%';
  if(el){
    const r=el.getBoundingClientRect(),p=6;
    hole=`<div style="position:fixed;left:${r.left-p}px;top:${r.top-p}px;width:${r.width+p*2}px;height:${r.height+p*2}px;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.72);border:3px solid #fbbf24;pointer-events:none"></div>`;
    pos=r.top>vh*0.5?`bottom:${vh-r.top+p+14}px`:`top:${r.bottom+p+14}px`;
  }else hole='<div style="position:fixed;inset:0;background:rgba(0,0,0,.72)"></div>';
  $('tour').innerHTML=`<div style="position:fixed;inset:0;z-index:90">${hole}<div style="position:fixed;left:12px;right:12px;${pos};max-width:420px;margin:0 auto;max-height:60vh;overflow-y:auto" class="bg-white rounded-3xl p-4 shadow-2xl"><div class="flex items-center justify-between mb-1"><b class="text-indigo-600">🧭 ${tourI+1} / ${TA.length}</b><button onclick="endTour()" class="h-10 px-3 rounded-xl text-slate-400 text-sm font-semibold">${L('跳過','Skip','スキップ')}</button></div><b class="block text-[17px] mb-1">${pickX(s.t)}</b><p class="text-[15px] leading-relaxed mb-4">${pickX(s.x)}</p><div class="flex gap-2"><button onclick="tourGo(-1)" ${tourI===0?'disabled':''} class="flex-1 h-12 rounded-2xl bg-slate-100 text-slate-600 font-bold disabled:opacity-40 ${BTN}">‹ ${L('上一步','Back','戻る')}</button><button onclick="tourGo(1)" class="flex-1 h-12 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold ${BTN}">${last?L('完成','Done','完了'):L('下一步','Next','次へ')+' ›'}</button></div></div></div>`;
}

/* ===== 圖表頁玩家拖曳排序 ===== */
let dragEnd=0;
function pickChart(id){if(Date.now()-dragEnd<500)return;chartP=id;render()}
function dragInit(box){
  if(!box)return;
  let d=null,timer=0,sx=0,sy=0;
  const cs=()=>[...box.querySelectorAll('[data-pid]')];
  const begin=(el,x,y)=>{sx=x;sy=y;clearTimeout(timer);timer=setTimeout(()=>{d={el,moved:false};el.style.transform='scale(1.12)';el.style.boxShadow='0 8px 20px rgba(0,0,0,.3)';el.style.zIndex=5;navigator.vibrate&&navigator.vibrate(15)},380)};
  const move=(x,y,ev)=>{
    if(!d){if(Math.abs(x-sx)>8||Math.abs(y-sy)>8)clearTimeout(timer);return}
    if(ev.cancelable)ev.preventDefault();
    d.moved=true;
    const over=cs().find(c=>{if(c===d.el)return false;const r=c.getBoundingClientRect();return x>r.left&&x<r.right});
    if(over){const r=over.getBoundingClientRect();box.insertBefore(d.el,x<r.left+r.width/2?over:over.nextSibling)}
    const b=box.getBoundingClientRect();if(x<b.left+36)box.scrollLeft-=10;else if(x>b.right-36)box.scrollLeft+=10;
  };
  const end=()=>{
    clearTimeout(timer);if(!d)return;const x=d;d=null;
    x.el.style.transform=x.el.style.boxShadow=x.el.style.zIndex='';
    dragEnd=Date.now();
    if(x.moved){const ids=cs().map(c=>c.dataset.pid);S.players=[...ids.map(i=>pl(i)).filter(Boolean),...S.players.filter(p=>!ids.includes(p.id))];save()}
  };
  box.addEventListener('touchstart',e=>{const el=e.target.closest('[data-pid]');if(el)begin(el,e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  box.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY,e),{passive:false});
  box.addEventListener('touchend',end);box.addEventListener('touchcancel',end);
  box.addEventListener('mousedown',e=>{const el=e.target.closest('[data-pid]');if(el)begin(el,e.clientX,e.clientY)});
  box.addEventListener('mousemove',e=>{if(e.buttons||d)move(e.clientX,e.clientY,e)});
  box.addEventListener('mouseup',end);box.addEventListener('mouseleave',end);
}
function remind(){
  if(!S.games.length)return '';
  const d=PREF.lastBackup?(new Date(nowStr())-new Date(PREF.lastBackup))/864e5:999;
  if(d<=30)return '';

async function unzipText(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf),dec=new TextDecoder(),files={};
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;

    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    p+=46+nl+xl+cl;
    if(!/\.(xml|rels)$/.test(name))continue;
    const ds=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    let data=u8.subarray(ds,ds+csz);
    if(method===8)data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else if(method!==0)throw 0;

function sheetRows(xml,shared){
  const rows=[];

    const row=[];
    for(const cm of (rm[1]||'').matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){

  const sheets=[{name:L('每場紀錄','Games','対局記録'),rows:s1},{name:L('逐人明細','By player','個人別'),rows:s2},{name:L('排行','Ranking','ランキング'),rows:s3},{name:L('每月結算','Monthly','月別'),rows:s4}];
  if(fee){
    const FM={};S.games.forEach(g=>{if(!g.fee)return;const k=g.date.slice(0,7),o=FM[k]=FM[k]||{v:0,c:0};o.v=r2(o.v+g.fee);o.c++});
    const fk=Object.keys(FM).sort();
    sheets.push({name:L('東錢','Table fee','場代'),rows:[[L('月份','Month','月'),L('東錢總和','Table fee total','場代合計'),L('場數','Games','対局数')],...fk.map(k=>[k,FM[k].v,FM[k].c]),...(fk.length?[[L('總計','Total','合計'),r2(fk.reduce((a,k)=>a+FM[k].v,0)),fk.reduce((a,k)=>a+FM[k].c,0)]]:[])]});
  }
  const chunk=s=>{const a=[];for(let i=0;i<s.length;i+=30000)a.push(s.slice(i,i+30000));return a};
  sheets.push({name:'_players',hidden:true,rows:S.players.map(p=>[p.name,p.color,...chunk(p.photo||'')])});
  sheets.push({name:'_venues',hidden:true,rows:S.venues.map(v=>[v.name])});
  sheets.push({name:'_prefs',hidden:true,rows:Object.entries(prefsClean()).map(([k,v])=>[k,String(v)])});
  return out(`mahjong-${stamp()}.xlsx`,makeXlsx(sheets),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* 備份與分享 */
async function out(name,text,mime){
  const f=new File([text],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e4);
}

function impFile(e){
  const f=e.files[0];if(!f)return;
  const isX=/\.xlsx$/i.test(f.name)||/spreadsheet/.test(f.type);
  (isX?readXlsxBackup(f):f.text().then(t=>{const d=JSON.parse(t);return d.data?Object.assign({},d.data,{prefs:d.prefs}):d})).then(applyImport).catch(()=>alert('檔案格式不正確，無法匯入'));

}

  if(autoOn())await snapshot('auto');
  S=d;saveNow();const ap=applyPrefs(pf);D=newD();selDay=null;render();toast(ap?'匯入完成（含設定）':'匯入完成');
}

function tg(id){

function calc(){
  let s=0,filled=true;const ai=autoIdx();
  D.sel.forEach((id,i)=>{
    if(id==='unk'||i===ai)return;
    const e=$('a'+i);if(!e)return;
    e.value=e.value.replace(/[^\d.]/g,'');D.vals[i]=e.value;
    const n=parseFloat(e.value);
    if(isNaN(n))filled=false;else s+=n*D.sg[i];
    showDebt(i,!isNaN(n)&&n>0&&D.sg[i]<0);
    e.className=e.className.replace(/ ?text-(emerald|red)-\d+/g,'')+' '+(D.sg[i]>0?'text-emerald-600':'text-red-500');
  });
  const e=ai>=0?$('a'+ai):null;
  if(e){const v=r2(-s)||0;showDebt(ai,filled&&v<0);e.value=filled?money(v):'';e.className=e.className.replace(/ ?text-(emerald|red|slate)-\d+/g,'')+' '+cls(v)}
}

/* 統計 */
function stats(y){
  return S.players.map(p=>{
    let n=0,w=0,l=0,sum=0;
    S.games.forEach(g=>{if(y&&!g.date.startsWith(y))return;g.res.forEach(r=>{if(r.id!==p.id)return;n++;sum+=r.amt;if(r.amt>0)w++;else if(r.amt<0)l++})});
    return {p,n,w,l,d:n-w-l,sum:r2(sum)};
  });
}

/* 5 排行 */
function rankList(y){
  const gs=S.games.filter(g=>!y||g.date.startsWith(y));
  const last=[...gs].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).pop();
  const calc=sk=>{const m={};S.players.forEach(p=>m[p.id]={n:0,sum:0});gs.forEach(g=>{if(g.id===sk)return;g.res.forEach(r=>{const o=m[r.id];if(!o)return;o.n++;o.sum+=r.amt})});return m};
  const prev=last?calc(last.id):calc(null);
  const pr=S.players.filter(p=>prev[p.id].n>0).sort((a,b)=>prev[b.id].sum-prev[a.id].sum).map(p=>p.id);
  return stats(y).filter(s=>s.n>0).sort((a,b)=>b.sum-a.sum).map((s,i)=>{const j=pr.indexOf(s.p.id);return{...s,rank:i+1,mv:j<0?'new':j>i?'up':j<i?'down':'same'}});
}
const mvHTML=m=>{const c={up:['▲','#ef4444'],down:['▼','#38bdf8'],same:['➡','#e3b64b'],new:['✦','#e3b64b']}[m];return `<span class="rk-ar" style="color:${c[0]==='▲'?'#ef4444':c[1]}">${c[0]}<i>RANK</i></span>`};
const mvInline=m=>{const c={up:['▲','#ef4444'],down:['▼','#38bdf8'],same:['−','#22c55e'],new:['✦','#e3b64b']}[m];return `<span class="mv${m==='same'?' same':''}" style="color:${c[1]}">${c[0]}</span>`};

  const C={1:['#fff07a','#f4a800','#9a5f00','#d6283a'],2:['#ffffff','#b9c4d0','#66727f','#2f6fe0'],3:['#ffc592','#cd7f32','#78400f','#2a9a52']}[r];if(!C)return '';

};

  }).join('');
  return pageHead(L('排行榜','Ranking','ランキング'),y?L(`${y} 年排行`,`${y} Ranking`,`${y}年ランキング`):L('歷年累積','All-time','通算'))+`<div data-hs="rank" class="relative flex gap-2 overflow-x-auto pb-3 -mx-3 px-3">${chip('all',L('歷年累積','All-time','通算'))}${ys.map(v=>chip(v,v+L(' 年','','年'))).join('')}</div>
  <div class="text-sm text-slate-400 mb-3 px-1 leading-relaxed">${L(`共 ${gn} 場　※箭頭為與上一場前的名次比較`,`${gn} games · arrows compare with the rank before the latest game`,`全${gn}局　※矢印は直前の対局前との順位比較`)}</div>
  ${rl.length?rows:`<div class="panel p-6 text-center text-slate-400">${L('此年度無資料','No data for this year','この年のデータなし')}</div>`}${debtPanel()}`;
}

/* 設定：人員與場所 */
function setView(){
  const prow=S.players.map(p=>`<div data-tour="pl-card" class="${CARD} p-3 mb-2"><div class="flex items-center gap-3 mb-3">${av(p.name,p.color,p.photo,60)}<label class="flex-1 h-12 rounded-xl bg-indigo-50 text-indigo-700 font-semibold flex items-center justify-center ${BTN}">📷 ${p.photo?'更換照片':'選擇照片'}<input type="file" accept="image/*" class="hidden" onchange="setPhoto('${p.id}',this)"></label>${p.photo?`<button onclick="rmPhoto('${p.id}')" class="h-12 px-4 rounded-xl bg-slate-100 text-slate-500 font-semibold ${BTN}">移除</button>`:''}</div><div class="flex gap-2 mb-2"><input value="${esc(p.name)}" maxlength="8" oninput="rn('${p.id}',this.value)" class="flex-1 min-w-0 h-12 rounded-xl border-2 border-slate-200 px-3 text-lg font-medium"><button onclick="delP('${p.id}')" class="h-12 px-4 rounded-xl bg-red-50 text-red-500 font-semibold ${BTN}">刪除</button></div><div class="flex flex-wrap gap-2">${COLORS.map(c=>`<button onclick="setC('${p.id}','${c}')" class="w-10 h-10 rounded-full active:scale-90 ${p.color===c?'ring-4 ring-offset-1 ring-slate-400':''}" style="background:${c}"></button>`).join('')}<label class="w-10 h-10 rounded-full relative flex items-center justify-center text-lg border-2 border-dashed border-slate-300 overflow-hidden ${COLORS.includes(p.color)?'bg-white':'ring-4 ring-offset-1 ring-slate-400'}" style="${COLORS.includes(p.color)?'':'background:'+p.color}">${COLORS.includes(p.color)?'🎨':''}<input type="color" value="${p.color}" onchange="setC('${p.id}',this.value)" class="absolute inset-0 w-full h-full opacity-0"></label></div><div class="text-xs text-slate-400 mt-2">最後的 🎨 可自訂任意顏色</div></div>`).join('');
  const vrow=S.venues.map(x=>`<div class="${CARD} p-3 mb-2 flex gap-2"><input value="${esc(x.name)}" maxlength="12" oninput="rv('${x.id}',this.value)" class="flex-1 min-w-0 h-12 rounded-xl border-2 border-slate-200 px-3 text-lg font-medium"><button onclick="delV('${x.id}')" class="h-12 px-4 rounded-xl bg-red-50 text-red-500 font-semibold ${BTN}">刪除</button></div>`).join('');
  const add=f=>`<button onclick="${f}" class="w-full h-14 rounded-2xl bg-white border-2 border-dashed border-indigo-400 text-indigo-600 font-bold ${BTN}">`;
  return `<div id="sc" class="fixed inset-0 z-50 bg-slate-100 overflow-y-auto" style="padding-bottom:env(safe-area-inset-bottom)"><div class="max-w-md mx-auto px-3 pb-16"><div class="sticky top-0 z-10 bg-slate-100 flex items-center justify-between pb-3 -mx-3 px-3 shadow-sm" style="padding-top:calc(env(safe-area-inset-top) + 12px)"><b class="text-lg">玩家與場所</b><button onclick="closeSet()" class="h-12 px-6 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold ${BTN}">完成</button></div>
  <b class="block mb-2 mt-3">👥 人員（${S.players.length}）</b>${prow}${add('addP()')}＋ 新增人員</button>
  <b id="venueSec" class="block mt-8 mb-2" style="scroll-margin-top:calc(env(safe-area-inset-top) + 90px)">📍 對弈場所（${S.venues.length}）</b>${vrow}${add('addV()')}＋ 新增場所</button></div></div>`;
}
function openSet(sec){
  const o=$('sc'),t=o?o.scrollTop:0;
  mset(setView());tr($('modal'));document.body.style.overflow='hidden';
  if(sec==='venue')$('venueSec').scrollIntoView();else $('sc').scrollTop=t;
}
const closeSet=()=>{$('modal').innerHTML='';document.body.style.overflow='';render()};
function addP(){const n=S.players.length;S.players.push({id:uid(),name:L('玩家','Player ','プレイヤー')+(n+1),color:COLORS[n%COLORS.length]});save();openSet();const s=$('sc');s.scrollTop=s.scrollHeight}
function sync(id){const p=pl(id);S.games.forEach(g=>g.res.forEach(r=>{if(r.id===id){r.name=p.name;r.color=p.color}}));save()}
function rn(id,v){pl(id).name=v.trim()||L('未命名','Unnamed','名称未設定');sync(id)}
function setC(id,c){pl(id).color=c;sync(id);openSet()}
function delP(id){
  if(!confirm('確定刪除此人員？\n（過往對弈紀錄仍會保留，但不再列入勝率、圖表與排行）'))return;
  S.players=S.players.filter(p=>p.id!==id);D.sel=D.sel.filter(x=>x!==id);save();openSet();
}
function addV(){S.venues.push({id:uid(),name:L('場所','Venue ','場所')+(S.venues.length+1)});save();openSet();const s=$('sc');s.scrollTop=s.scrollHeight}
function rv(id,v){const x=S.venues.find(a=>a.id===id);x.name=v.trim()||L('未命名','Unnamed','名称未設定');S.games.forEach(g=>{if(g.vid===id)g.vname=x.name});save()}
function delV(id){
  if(!confirm('確定刪除此場所？\n（過往紀錄仍會保留場所名稱）'))return;
  S.venues=S.venues.filter(x=>x.id!==id);if(D.vid===id)D.vid='';save();openSet();
}

/* 數字滾動 */
let lastAK='';
function countUp(root){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  root.querySelectorAll('.cu').forEach(el=>{
    const t=el.textContent,m=t.match(/[\d,]+(\.\d+)?/);if(!m)return;
    const end=parseFloat(m[0].replace(/,/g,'')),dec=m[1]?m[1].length-1:0;if(!end)return;
    const a=t.slice(0,m.index),b=t.slice(m.index+m[0].length),t0=performance.now(),D=800;
    const f=n=>{const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,3);
      el.textContent=k>=1?t:a+(end*e).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec})+b;
      if(k<1)requestAnimationFrame(f)};
    requestAnimationFrame(f);
  });
}
/* 主繪製 */
function render(){
  const keep={};document.querySelectorAll('[data-hs]').forEach(e=>keep[e.dataset.hs]=e.scrollLeft);
  const ak=tab+'|'+(tab===3?chartP+'|'+chartY:'')+(tab===4?'|'+rankY:'');const fresh=ak!==lastAK;lastAK=ak;
  $('v').classList.toggle('anim',fresh);$('nav').classList.toggle('anim',fresh);
  $('hdr').innerHTML=hdrHTML();
  $('v').innerHTML=[v0,v1,v2,v3,v4][tab]();
  $('nav').innerHTML=TABS.map((t,i)=>`<button onclick="tab=${i};render();scrollTo(0,0)" class="h-[78px] flex flex-col items-center justify-center gap-1 text-[15px] ${i===tab?'text-indigo-700 font-extrabold nav-on':'text-slate-500 font-semibold'} ${BTN}"><span class="flex items-center justify-center px-5 py-1.5 rounded-2xl transition ${i===tab?'bg-indigo-100':''}">${t[0]}</span>${t[1]}</button>`).join('');
  tr($('hdr'));tr($('v'));tr($('nav'));
  if(tab===1)calc();
  document.querySelectorAll('[data-hs]').forEach(e=>{const k=e.dataset.hs;if(k in keep)e.scrollLeft=keep[k];else{const s=e.querySelector('[data-sel]');if(s)e.scrollLeft=s.offsetLeft-(e.clientWidth-s.offsetWidth)/2}});
  if(tab===3)dragInit($('chartChips'));
  if(fresh)countUp($('v'));
}
/* ===== 左右滑動切換分頁 ===== */
function goTab(n,dir){
  if(n<0||n>4||n===tab)return;
  tab=n;render();scrollTo(0,0);
  const v=$('v');v.classList.remove('sw-l','sw-r');void v.offsetWidth;v.classList.add(dir>0?'sw-l':'sw-r');
}
(()=>{
  let sx=0,sy=0,st=0,ok=false;
  const blocked=t=>!t||!t.closest||t.closest('[data-hs],.overflow-x-auto,[data-pid],input,select,textarea,label');
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||$('modal').innerHTML||$('tour').innerHTML||$('lb').innerHTML){ok=false;return}
    ok=!blocked(e.target);sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!ok)return;ok=false;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-dragEnd<400||Date.now()-st>700)return;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.7)goTab(tab+(dx<0?1:-1),dx<0?1:-1);
  },{passive:true});
})();
render();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))</script>
</body>
